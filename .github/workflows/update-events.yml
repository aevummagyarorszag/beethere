name: Update Events from Google Sheets

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-updater:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        # Pinned to the verified v4.2.2 commit to avoid a mutable action tag.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        # Pinned to the verified v5.6.0 commit to avoid a mutable action tag.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Run updater script
        run: python update_events.py
      - name: Save updated events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Auto-update events.json from Google Sheets" || exit 0
          git push
