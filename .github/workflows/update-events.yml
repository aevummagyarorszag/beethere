name: Update Events from Google Sheets

on:
  schedule:
    - cron: '0 0 * * *'  # Automatically runs every night at midnight
  workflow_dispatch:      # Adds a manual "Run workflow" button

permissions:
  contents: write

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run updater script
        run: python update_events.py

      - name: Save and push updated events.json to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Auto-update events.json from Google Sheets" || exit 0
          git push
